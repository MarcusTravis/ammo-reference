<!doctype html>

<head>

<style>:root{color-scheme:light}body{margin:0;font:16px system-ui,sans-serif}*,*::before,*::after{box-sizing:border-box}
:root{--bg:#f5f5f7;--surface:#fff;--fg:#1d1d1f;--muted:#6e6e73;--accent:#0066cc;--btn:#e8e8ed}
body{background:var(--bg);color:var(--fg)}
.wrap{max-width:760px;margin:0 auto;padding:56px max(18px,env(safe-area-inset-left,0px)) 40px}
.eyebrow{display:block;color:var(--muted);font-weight:600}
h1{margin:6px 0 10px}
.lede{margin:0 0 30px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.links a{display:inline-block;background:var(--surface);border-radius:999px;padding:9px 16px;text-decoration:none;font-weight:500;font-size:15px;color:var(--accent)}
.links a:hover{background:var(--btn)}
.links a.main{background:var(--accent);color:#fff}
</style>
<link rel="stylesheet" href="https://ammochart.net/theme.css">
<script>
// GitHub Pages mirror: /page/ (trailing slash) 404s there, so retry as /page.
(function(){var p=location.pathname;if(p.length>1&&p.charAt(p.length-1)==="/")location.replace(p.slice(0,-1)+location.search+location.hash);})();
</script>
</head>
<body>
<main class="wrap">
<span class="eyebrow">Error 404</span>
<h1>Page not found</h1>
<p class="lede">That page isn't here. It may have moved, or the link has a typo. Try one of these instead.</p>

</ul>
</main>
<p class="kofi">Free and ad-free. If this site helped you, <a href="https://ko-fi.com/marcustravis" target="_blank" rel="noopener">buy me a coffee →</a></p>
</body>
</html>
